<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enjoy Typing</title>
</head>

<style>
  html, body {
    overflow: hidden;
    margin: 0;
    padding: 0;
    border-radius: 16px;
    background: rgba(10, 15, 58, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #0A0F1A, #0A0F3A);
  }

  canvas {
    background: #000009;
    border-radius: 16px;
    box-shadow: 0 0 10px skyblue;
  }

  body::before{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    z-index: -2;
  }

  .top-bar {
    position: fixed;
    border-radius: 16px 16px 0 0;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
    -webkit-app-region: drag;
  }

  .icon-btn {
    pointer-events: auto;
    font-family: monospace;
    font-size: 16px;
    color: skyblue;
    background: rgba(0,0,0,0.4);
    border: 1px solid skyblue;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(135,206,250,0.6);
    transition: all 0.2s ease;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  .icon-btn:hover {
    box-shadow: 0 0 12px rgba(135,206,250,1);
  }

  .muted {
    text-decoration: line-through;
    opacity: 0.6;
  }
</style>

<body>

    <div class="top-bar">
  <div style="display:flex; gap:8px;">
    <div id="muteBtn" class="icon-btn">🔊</div>
  </div>

  <div style="display:flex; gap:8px;">
    <div id="minBtn" class="icon-btn">—</div>
    <div id="closeBtn" class="icon-btn">✕</div>
    <div id="fullscreenBtn" class="icon-btn">⛶</div>

  </div>
</div>

  <canvas id="vis"></canvas>

<script>
  const canvas = document.getElementById("vis");
  const ctx = canvas.getContext("2d");

  const decay = 0.94;
  const keys = 'ab[]cd()ef34gh78ij{}kl+=mn56op@#qr$%stuvwxyz,./;:1290-_?><`~!^&*'.split('');
  const barCount = keys.length;

  let barWidth = 10;
  let gap = 6;
  let startX = 0;
  let barY = 0;
  let maxHeight = -100;

  const bars = new Array(barCount).fill(-0.5);
  const trails = new Array(barCount).fill().map(() => []);
  const TRAIL_LENGTH = 24;
  const TRAIL_FADE = 0.75;
  const keyLabels = new Array(barCount).fill(null);

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let muted = false;

  function resize() {
    canvas.width = window.innerWidth - 30;
    canvas.height = window.innerHeight - 30;

    barY = canvas.height - 20;
    barWidth = (canvas.width / barCount) * 0.6;
    gap = Math.min(14, barWidth * 0.6);
    const totalWidth =
      barWidth * barCount + gap * (barCount - 1);
    startX = (canvas.width - totalWidth) / 2;

    maxHeight = -barY + 20;

    for (let i = 0; i < barCount; i++) {
      bars[i] = Math.max(maxHeight, Math.min(-0.5, bars[i]));
      for (let t = 0; t < trails[i].length; t++) {
        trails[i][t] = Math.max(maxHeight, Math.min(-0.5, trails[i][t]));
      }
    }
  }

  resize();
  window.addEventListener("resize", resize);

  const noteFrequencies = {
    'a': 392.00, 'b': 415.30, 'c': 440.00, 'd': 466.16, 'e': 493.88,
    'f': 523.25, 'g': 554.37, 'h': 587.33, 'i': 622.25, 'j': 659.25,
    'k': 698.46, 'l': 739.99, ';': 783.99, ',': 830.61,
    '1': 329.63, '2': 349.23, '3': 369.99, '4': 392.00, '5': 415.30,
    '6': 440.00, '7': 466.16, '8': 493.88, '9': 523.25, '0': 554.37,
    '.': 587.33, '/': 622.25, ':': 659.25, '-': 698.46, '_': 739.99,
    '+': 783.99, '=': 830.61, '@': 880.00, '#': 932.33, '$': 987.77,
    '%': 1046.50, '^': 1108.73, '&': 1174.66, '*': 1244.51, '?': 1318.51,
    '>': 1396.91, '<': 1480.00, '`': 1567.98, '~': 1661.22,
    '[': 880.00, ']': 932.33, '{': 987.77, '}': 1046.50,
    '(': 1108.73, ')': 1174.66,
    'm': 329.63, 'n': 349.23, 'o': 369.99, 'p': 392.00,
    'q': 415.30, 'r': 440.00, 's': 466.16, 't': 493.88,
    'u': 523.25, 'v': 554.37, 'w': 587.33, 'x': 622.25,
    'y': 659.25, 'z': 698.46
  };

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let x = startX;

    for (let i = 0; i < barCount; i++) {
      const barX = x;
      const barH = bars[i];

      for (let t = 0; t < trails[i].length; t++) {
        const h = trails[i][t];
        const alpha = (t + 1) / trails[i].length * TRAIL_FADE;
        ctx.fillStyle = `rgba(135,206,250,${alpha * 0.7})`;
        ctx.fillRect(barX, barY + h - 2, barWidth, 4);
      }

      ctx.fillStyle = "skyblue";
      ctx.shadowColor = "cyan";
      ctx.shadowBlur = 15;
      ctx.fillRect(barX, barY, barWidth, barH);

      if (keyLabels[i]) {
        ctx.font = "bold 13px monospace";
        ctx.fillStyle = "lightblue";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.shadowBlur = 8;
        ctx.fillText(
          keyLabels[i].toUpperCase(),
          barX + barWidth / 2,
          barY + barH - 25
        );
      }

      trails[i].push(barH);
      if (trails[i].length > TRAIL_LENGTH) trails[i].shift();
      if (bars[i] < -0.5) bars[i] *= decay;

      x += barWidth + gap;
    }

    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const index = keys.indexOf(k);
    if (index === -1) return;

    bars[index] = maxHeight;
    keyLabels[index] = k;

    if (muted) return;

    const freq = noteFrequencies[k];
    if (!freq) return;

    audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq;

    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.5, now + 0.005);
    gain.gain.linearRampToValueAtTime(0.0, now + 1.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
  });

  document.getElementById('muteBtn').addEventListener('click', () => {
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
    audioCtx[muted ? 'suspend' : 'resume']();
  });

  const { ipcRenderer } = require('electron');
  document.getElementById("minBtn").addEventListener("click", () => {
    ipcRenderer.send('minimize');
  });

  document.getElementById("closeBtn").addEventListener("click", () => {
    ipcRenderer.send('close');
  });

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    ipcRenderer.send('fullscreen');
  });

</script>

</body>
</html>
