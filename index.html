<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enjoy Typing</title>
</head>

<style>
  :root {
    --theme-color: #4cc9f0;
    --theme-glow: #76e0ff;
    --theme-shadow: rgba(76, 201, 240, 0.6);
    --theme-shadow-strong: rgba(76, 201, 240, 1);
    --theme-gradient-start: #0a0f2a;
    --theme-gradient-end: #0a1f4a;
  }
  html, body {
    overflow: hidden;
    margin: 0;
    padding: 0;
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: transparent;
    color: var(--theme-color);
    transition: background 0.6s ease;
  }

  canvas {
    background: #000009;
    border-radius: 16px;
    box-shadow: 0 0 10px var(--theme-color);
    transition: box-shadow 0.4s ease;

  }

  body::before{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(to bottom, var(--theme-gradient-start), var(--theme-gradient-end));
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    z-index: -2;
  }

  .top-bar {
    position: fixed;
    border-radius: 16px 16px 0 0;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
    -webkit-app-region: drag;
  }

  .icon-btn, .selector {
    pointer-events: auto;
    font-family: monospace;
    font-size: 16px;
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    box-shadow: 0 0 8px var(--theme-shadow);
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  .icon-btn:hover, .selector:hover {
    box-shadow: 0 0 12px var(--theme-shadow-strong);
  }

  .muted {
    text-decoration: line-through;
    opacity: 0.6;
  }
</style>

<body>

    <div class="top-bar">
  <div style="display:flex; gap:8px;">
    <div id="muteBtn" class="icon-btn">🔊</div>
    <select id="colorSelect" class="selector">
        <option value="#009fff">🔵</option>
        <option value="#ff5555">🔴</option>
        <option value="#55ff55">🟢</option>
        <option value="#ffaa00">🟠</option>
        <option value="#cc55ff">🟣</option>
        <option value="#ffffff">⚪</option>
    </select>
    <select id="visModeSelect" class="selector">
        <option value="bars">Bars</option>
        <option value="circles">Circles</option>
    </select>
  </div>

  <div style="display:flex; gap:8px;">
    <div id="minBtn" class="icon-btn">—</div>
    <div id="closeBtn" class="icon-btn">✕</div>
    <div id="fullscreenBtn" class="icon-btn">⛶</div>

  </div>
</div>

  <canvas id="vis"></canvas>

<script>
  const root = document.documentElement;
    const colorSelect = document.getElementById('colorSelect');

    function setThemeColor(color) {
      root.style.setProperty('--theme-color', color);
      const isWhite = color.toLowerCase() === '#ffffff' || color.toLowerCase() === 'white';
      const glowColor = isWhite ? '#f0f8ff' : shadeColor(color, -0.1);
      const shadowAlpha = isWhite ? 0.9 : 0.6;
      const darkColor = isWhite ? '#1a1a2e' : shadeColor(color, -0.75);
      const midColor  = isWhite ? '#2a2a4a' : shadeColor(color, -0.45);
      root.style.setProperty('--theme-gradient-start', darkColor);
      root.style.setProperty('--theme-gradient-end', midColor);
      root.style.setProperty('--theme-glow', glowColor);
      root.style.setProperty('--theme-shadow', hexToRgba(color, shadowAlpha));
      root.style.setProperty('--theme-shadow-strong', hexToRgba(color, 1));
      document.getElementById('muteBtn').style.color = color;
    }

    function shadeColor(color, percent) {
      let hex = color.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      let r = parseInt(hex.substr(0,2), 16);
      let g = parseInt(hex.substr(2,2), 16);
      let b = parseInt(hex.substr(4,2), 16);
      r = Math.floor(r * (1 + percent));
      g = Math.floor(g * (1 + percent));
      b = Math.floor(b * (1 + percent));
      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));
      return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    }

    function hexToRgba(hex, alpha = 1) {
      hex = hex.replace('#', '');
      const r = parseInt(hex.substr(0,2), 16);
      const g = parseInt(hex.substr(2,2), 16);
      const b = parseInt(hex.substr(4,2), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    colorSelect.addEventListener('change', () => {
      setThemeColor(colorSelect.value);
    });
    setThemeColor(colorSelect.value);




  //Visualization Start  
  const canvas = document.getElementById("vis");
  const ctx = canvas.getContext("2d");

  const decay = 0.94;
  const keys = 'ab[]cd()ef34gh78ij{}kl+=mn56op@#qr$%stuvwxyz,./;:1290-_?><`~!^&*'.split('');
  const barCount = keys.length;

  let barWidth = 10;
  let gap = 6;
  let startX = 0;
  let barY = 0;
  let maxHeight = -100;

  const bars = new Array(barCount).fill(-0.5);
  const trails = new Array(barCount).fill().map(() => []);
  const TRAIL_LENGTH = 24;
  const TRAIL_FADE = 0.75;
  const keyLabels = new Array(barCount).fill(null);

  //Circle Mode
    const WAVE_SPEED = 2.5;
    const MAX_RADIUS = 200;          
    const rowGroups = [
      keys.reduce((acc, k, i) => {
        if ('1234567890'.includes(k)) acc.push(i);
        return acc;
      }, []),
      keys.reduce((acc, k, i) => {
        if ('abcdefghijklmnopqrstuvwxyz'.includes(k)) acc.push(i);
        return acc;
      }, []),
      keys.reduce((acc, k, i) => {
        if (!'1234567890abcdefghijklmnopqrstuvwxyz'.includes(k)) acc.push(i);
        return acc;
      }, [])
    ];
    const usedIndices = [...new Set(rowGroups.flat())];
    const circleWaves = new Array(barCount).fill().map(() => []);


  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let muted = false;

  function resize() {
    canvas.width = window.innerWidth - 30;
    canvas.height = window.innerHeight - 30;

    barY = canvas.height - 20;
    barWidth = (canvas.width / barCount) * 0.6;
    gap = Math.min(14, barWidth * 0.6);
    const totalWidth =
      barWidth * barCount + gap * (barCount - 1);
    startX = (canvas.width - totalWidth) / 2;

    maxHeight = -barY + 20;

    for (let i = 0; i < barCount; i++) {
      bars[i] = Math.max(maxHeight, Math.min(-0.5, bars[i]));
      for (let t = 0; t < trails[i].length; t++) {
        trails[i][t] = Math.max(maxHeight, Math.min(-0.5, trails[i][t]));
      }
    }
  }

  resize();
  window.addEventListener("resize", resize);

  const noteFrequencies = {
    'a': 392.00, 'b': 415.30, 'c': 440.00, 'd': 466.16, 'e': 493.88,
    'f': 523.25, 'g': 554.37, 'h': 587.33, 'i': 622.25, 'j': 659.25,
    'k': 698.46, 'l': 739.99, ';': 783.99, ',': 830.61,
    '1': 329.63, '2': 349.23, '3': 369.99, '4': 392.00, '5': 415.30,
    '6': 440.00, '7': 466.16, '8': 493.88, '9': 523.25, '0': 554.37,
    '.': 587.33, '/': 622.25, ':': 659.25, '-': 698.46, '_': 739.99,
    '+': 783.99, '=': 830.61, '@': 880.00, '#': 932.33, '$': 987.77,
    '%': 1046.50, '^': 1108.73, '&': 1174.66, '*': 1244.51, '?': 1318.51,
    '>': 1396.91, '<': 1480.00, '`': 1567.98, '~': 1661.22,
    '[': 880.00, ']': 932.33, '{': 987.77, '}': 1046.50,
    '(': 1108.73, ')': 1174.66,
    'm': 329.63, 'n': 349.23, 'o': 369.99, 'p': 392.00,
    'q': 415.30, 'r': 440.00, 's': 466.16, 't': 493.88,
    'u': 523.25, 'v': 554.37, 'w': 587.33, 'x': 622.25,
    'y': 659.25, 'z': 698.46
  };

  let currentVisMode = 'bars';
    const visModeSelect = document.getElementById('visModeSelect');
    visModeSelect.addEventListener('change', () => {
      currentVisMode = visModeSelect.value;
    });

  function drawVisualization() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const themeColor = hexToRgba(getComputedStyle(root).getPropertyValue('--theme-color').trim(), 0.7);
      //const shadowcolor = hexToRgba(getComputedStyle(root).getPropertyValue('--theme-glow').trim(), 0.5);
      if (currentVisMode === 'circles') {
        const rowYs = [canvas.height * 0.25, canvas.height * 0.55, canvas.height * 0.85];

        rowGroups.forEach((groupIndices, rowIdx) => {
          const count = groupIndices.length;
          if (count === 0) return;

          const colSpacing = canvas.width / (count + 1);

          groupIndices.forEach((index, col) => {
            const posX = (col + 1) * colSpacing;
            const posY = rowYs[rowIdx];

            circleWaves[index] = circleWaves[index]
              .map(r => r + WAVE_SPEED)
              .filter(r => {
                const alpha = Math.max(0, 1 - (r - 40) / (MAX_RADIUS - 40));
                return alpha > 0.02;

          });
            circleWaves[index].forEach(radius => {
              const alpha = Math.max(0, 1 - (radius - 40) / (MAX_RADIUS - 40));
              ctx.beginPath();
              ctx.arc(posX, posY, radius, 0, Math.PI * 2);
              ctx.strokeStyle = hexToRgba(getComputedStyle(root).getPropertyValue('--theme-color').trim(), alpha);
              ctx.lineWidth = 2.5 + alpha * 2;
              ctx.stroke();
            });
        if (keyLabels[index]) {
          const label = keyLabels[index];
          ctx.font = "bold 13px monospace";
          ctx.fillStyle = themeColor;
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(label.toUpperCase(), posX, posY);
        }
        });
        });
      } else if (currentVisMode === 'bars') {
          let x = startX;

          for (let i = 0; i < barCount; i++) {
            const barX = x;
            const barH = bars[i];

            for (let t = 0; t < trails[i].length; t++) {
              const h = trails[i][t];
              const alpha = (t + 1) / trails[i].length * TRAIL_FADE;
              ctx.fillStyle = themeColor;
              ctx.fillRect(barX, barY + h - 2, barWidth, 4);
            }

            ctx.fillStyle = themeColor;
            ctx.fillRect(barX, barY, barWidth, barH);

            if (keyLabels[i]) {
              ctx.font = "bold 13px monospace";
              ctx.fillStyle = themeColor;
              ctx.textAlign = "center";
              ctx.textBaseline = "bottom";
              ctx.shadowBlur = 8;
              ctx.fillText(
                keyLabels[i].toUpperCase(),
                barX + barWidth / 2,
                barY + barH - 25
              );
            }

            trails[i].push(barH);
            if (trails[i].length > TRAIL_LENGTH) trails[i].shift();
            if (bars[i] < -0.5) bars[i] *= decay;

            x += barWidth + gap;
          }

      }
  }

    function animate() {
      drawVisualization();
      requestAnimationFrame(animate);
    }

    animate();

  window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      const index = keys.indexOf(k);
      if (index === -1) return;

      if (currentVisMode === 'circles') {
        circleWaves[index].push(1);
        keyLabels[index] = k;
      } else {
        bars[index] = maxHeight;
        keyLabels[index] = k;                 
      }

      if (muted) return;
      const freq = noteFrequencies[k] / 2;
      if (!freq) return;
      audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.6);
    });


  document.getElementById('muteBtn').addEventListener('click', () => {
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
    audioCtx[muted ? 'suspend' : 'resume']();
  });

  const { ipcRenderer } = require('electron');
  document.getElementById("minBtn").addEventListener("click", () => {
    ipcRenderer.send('minimize');
  });

  document.getElementById("closeBtn").addEventListener("click", () => {
    ipcRenderer.send('close');
  });

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    ipcRenderer.send('fullscreen');
  });

</script>

</body>
</html>
